<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Netflix OTP">
  <title>Netflix OTP</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0b0b0d;
      --text: #f5f5f7;
      --muted: #8e8e96;
      --faint: #3a3a40;
      --accent: #e50914;
      --accent-press: #b20710;
      --field: #1a1a1e;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      -webkit-tap-highlight-color: transparent;
    }
    main {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
    }
    #code {
      min-height: 1.2em;
      font-size: clamp(64px, 22vw, 104px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.12em;
      margin-right: -0.12em; /* keep letter-spaced digits optically centred */
      line-height: 1.1;
      user-select: all;
      cursor: pointer;
      border: 0;
      background: none;
      color: inherit;
      font-family: inherit;
      padding: 0;
    }
    #code.empty { color: var(--faint); cursor: default; }
    #code.waiting { animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    #link {
      display: none;
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 16px 28px;
    }
    #status {
      min-height: 1.4em;
      margin-top: -16px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }
    #status.error { color: var(--danger); }
    button.primary {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 14px;
      background: var(--accent);
      color: #fff;
      font-size: 19px;
      font-weight: 650;
      font-family: inherit;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    button.primary:active { transform: scale(0.98); background: var(--accent-press); }
    button.primary:focus-visible, #code:focus-visible, #link:focus-visible, input:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 3px;
    }
    #keyform { display: none; width: 100%; gap: 12px; flex-direction: column; }
    #keyform input {
      height: 54px;
      border-radius: 14px;
      border: 1px solid var(--faint);
      background: var(--field);
      color: var(--text);
      font-size: 17px;
      padding: 0 16px;
      text-align: center;
    }
    body.needs-key #keyform { display: flex; }
    body.needs-key #code, body.needs-key #press { display: none; }
    body.is-link #code { display: none; }
    body.is-link #link { display: inline-block; }
  </style>
</head>
<body>
  <main>
    <button id="code" class="empty" type="button" aria-live="polite" aria-label="Code">––––</button>
    <a id="link" href="#" target="_blank" rel="noopener noreferrer">Get code</a>
    <div id="status" role="status"></div>
    <button id="press" class="primary" type="button">I've requested</button>
    <form id="keyform" autocomplete="off">
      <input id="keyinput" type="password" placeholder="Family key" aria-label="Family key" required>
      <button class="primary" type="submit">Save</button>
    </form>
  </main>

  <script>
    (() => {
      const WATCH_MS = 3 * 60 * 1000;  // keep checking for 3 minutes after the tap
      const VALID_MS = 15 * 60 * 1000; // Netflix codes last 15 minutes
      const WAIT_S = 20;               // each request waits up to this long on the server
      const KEY_STORE = 'netflixOtp.key';
      const STATE_STORE = 'netflixOtp.state';

      const $ = (id) => document.getElementById(id);
      const codeEl = $('code'), linkEl = $('link'), statusEl = $('status');

      const store = {
        get(k) { try { return localStorage.getItem(k); } catch { return null; } },
        set(k, v) { try { localStorage.setItem(k, v); } catch {} },
      };

      // The family share link looks like https://your-app/#key=SECRET
      const hashKey = (location.hash.match(/[#&]key=([^&]+)/) || [])[1];
      if (hashKey) store.set(KEY_STORE, decodeURIComponent(hashKey));
      let key = store.get(KEY_STORE) || '';

      let state = { startedAt: 0, since: null, offset: 0, result: null };
      try { Object.assign(state, JSON.parse(store.get(STATE_STORE) || '{}')); } catch {}
      const save = () => store.set(STATE_STORE, JSON.stringify(state));

      let runId = 0, activeLoop = null, error = '', flash = '', flashTimer;

      const serverNow = () => Date.now() + (state.offset || 0);
      const watching = () => Date.now() < state.startedAt + WATCH_MS;
      const validResult = () => state.result && serverNow() < state.result.receivedAt + VALID_MS ? state.result : null;

      function ago(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        if (s < 5) return 'just now';
        if (s < 60) return `${s}s ago`;
        return `${Math.floor(s / 60)} min ago`;
      }

      function setStatus(text, isError) {
        statusEl.textContent = text;
        statusEl.classList.toggle('error', !!isError);
      }

      function render() {
        const result = validResult();
        document.body.classList.toggle('is-link', !!result && result.type === 'link');
        codeEl.classList.toggle('empty', !result || result.type !== 'code');
        codeEl.classList.toggle('waiting', !result && watching() && !error);

        if (result && result.type === 'code') {
          codeEl.textContent = result.value;
          codeEl.setAttribute('aria-label', `Code ${result.value.split('').join(' ')}. Tap to copy.`);
        } else {
          codeEl.textContent = '––––';
          codeEl.setAttribute('aria-label', 'No code yet');
        }
        if (result && result.type === 'link') {
          linkEl.href = result.value;
          linkEl.textContent = result.label || 'Open Netflix link';
        }

        if (flash) return setStatus(flash);
        if (error) return setStatus(error, true);
        if (result) {
          const when = `Received ${ago(serverNow() - result.receivedAt)}`;
          return setStatus(result.type === 'code' ? `${when} · tap to copy` : `${when} · tap to open`);
        }
        if (watching()) return setStatus('Checking email…');
        if (state.startedAt && state.result) return setStatus('That code has expired');
        if (state.startedAt) return setStatus('No code arrived. Request one on Netflix, then tap again.');
        setStatus('Request a code on Netflix, then tap the button.');
      }

      const delay = (ms) => new Promise((r) => setTimeout(r, ms));

      async function watch() {
        const id = runId;
        if (activeLoop === id) return;
        activeLoop = id;
        try {
          while (id === runId && watching()) {
            const started = Date.now();
            const params = new URLSearchParams({ wait: String(WAIT_S) });
            if (state.since) params.set('since', String(state.since));
            if (state.result) params.set('after', String(state.result.receivedAt));
            try {
              const ctrl = new AbortController();
              const timer = setTimeout(() => ctrl.abort(), (WAIT_S + 25) * 1000);
              const res = await fetch('/api/code?' + params, {
                headers: { Authorization: 'Bearer ' + key },
                cache: 'no-store',
                signal: ctrl.signal,
              });
              clearTimeout(timer);
              const data = await res.json().catch(() => ({}));
              if (id !== runId) return;
              if (res.status === 401) { state.startedAt = 0; save(); askForKey(data.error); return; }
              if (res.status === 500 || res.status === 429) { return stop(data.error || 'Server problem'); }
              if (!res.ok) throw new Error(data.error || 'Could not check email. Trying again…');

              error = '';
              state.since = data.since;
              state.offset = data.now - Date.now();
              const r = data.result;
              if (r && (!state.result || r.receivedAt > state.result.receivedAt)) state.result = r;
              save();
              render();
            } catch (e) {
              if (id !== runId) return;
              error = e.name === 'AbortError' ? 'Still checking…' : (e.message || 'Connection problem. Trying again…');
              if (e instanceof TypeError) error = 'No connection. Trying again…';
              render();
              await delay(3000);
            }
            const took = Date.now() - started;
            if (took < 1000) await delay(1000 - took);
          }
          if (id === runId) { error = ''; render(); }
        } finally {
          if (activeLoop === id) activeLoop = null;
        }
      }

      // A problem retrying won't fix (server not set up, too many wrong keys).
      function stop(message) {
        error = message;
        state.startedAt = 0;
        save();
        render();
      }

      function askForKey(message) {
        document.body.classList.add('needs-key');
        setStatus(message && key ? message : 'Enter the family key', !!(message && key));
        $('keyinput').focus();
      }

      $('keyform').addEventListener('submit', (e) => {
        e.preventDefault();
        key = $('keyinput').value.trim();
        if (!key) return;
        store.set(KEY_STORE, key);
        $('keyinput').value = '';
        document.body.classList.remove('needs-key');
        error = '';
        render();
      });

      $('press').addEventListener('click', () => {
        if (!key) return askForKey();
        runId++;
        error = '';
        flash = '';
        state = { startedAt: Date.now(), since: null, offset: state.offset || 0, result: null };
        save();
        render();
        watch();
      });

      codeEl.addEventListener('click', async () => {
        const result = validResult();
        if (!result || result.type !== 'code') return;
        try {
          await navigator.clipboard.writeText(result.value);
          flash = 'Copied';
        } catch {
          flash = 'Long-press the code to copy';
        }
        clearTimeout(flashTimer);
        flashTimer = setTimeout(() => { flash = ''; render(); }, 1500);
        render();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') { render(); if (watching()) watch(); }
      });
      setInterval(render, 1000);

      if (!key) askForKey(); else render();
      if (key && watching()) watch();
    })();
  </script>
</body>
</html>
